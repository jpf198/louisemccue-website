<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Vote | Lou McCue</title>
    <link rel="stylesheet" href="../styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="../index.html" aria-label="Lou McCue home">Lou McCue<span>.</span></a>
      <nav aria-label="Main navigation">
        <a href="../index.html">Home</a>
        <a href="../about.html">The Author</a>
        <a href="../book.html">The Book</a>
      </nav>
    </header>
    <main class="reader-page">
      <section class="page-heading vote-heading">
        <p class="eyebrow">A reader poll</p>
        <h1>Did she or didn't she?</h1>
        <p class="page-lead">Did Sarah, or didn't Sarah, with Ruben?</p>
      </section>
      <section class="vote-panel" aria-label="Cast your vote">
        <div id="banner" class="consent-banner" role="region" aria-label="Cookie consent" hidden>
          <p>To vote or comment we need to set a cookie that remembers who you are, so you aren't asked again. Without it you can still see the votes and comments.</p>
          <button class="button" data-accept>Accept cookie</button>
          <button class="button" data-decline>No thanks</button>
        </div>
        <p id="msg" class="reader-message" role="status" aria-live="polite"></p>
        <div id="buttons" class="vote-choices" role="group" aria-label="Choose your answer">
          <button class="button" data-choice="did">She did</button>
          <button class="button" data-choice="didnt">She didn't</button>
        </div>
        <p id="results" class="vote-results" aria-live="polite"></p>
        <p class="vote-comments"><a class="text-link" href="comments.html">Read and leave comments <span aria-hidden="true">→</span></a></p>
        <script type="module">
          import { castVote, voteResults, myVote, initConsent } from "./js/api.js";
          const msg = document.getElementById("msg");
          const results = document.getElementById("results");
          const buttons = document.querySelectorAll("[data-choice]");
          let voter = null;
          const show = (r) => { results.textContent = `She did: ${r.did} · She didn't: ${r.didnt}`; };
          voteResults().then(show).catch((e) => { msg.textContent = e.message; });
          initConsent(document.getElementById("banner"), async (id) => {
            voter = id;
            buttons.forEach((b) => { b.disabled = !id; });
            if (!id) { msg.textContent = "Accept the cookie to cast your vote."; return; }
            msg.textContent = "";
            try {
              const prev = await myVote(id);
              if (prev) msg.textContent = "You voted: " + (prev === "did" ? "She did" : "She didn't") + ". You can change your vote.";
            } catch (e) { /* ignore */ }
          });
          buttons.forEach((b) => b.addEventListener("click", async () => {
            if (!voter) return;
            try { show(await castVote(voter, b.dataset.choice)); msg.textContent = "Thanks, your vote is in."; }
            catch (e) { msg.textContent = e.message; }
          }));
        </script>
      </section>
    </main>
  </body>
</html>
